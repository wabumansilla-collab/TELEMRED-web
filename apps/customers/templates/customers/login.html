{% extends 'base.html' %}

{% block content %}
<div style="max-width: 480px; margin: 3rem auto;">
    <div class="form-container" style="padding: 3rem 2.5rem; border-radius: 20px;">
        <div style="text-align: center; margin-bottom: 2rem;">
            <div class="logo-icon" style="margin: 0 auto 1rem; width: 48px; height: 48px; font-size: 1.6rem;">T</div>
            <h1 style="font-size: 1.8rem; margin-bottom: 0.4rem;">Acceso Corporativo</h1>
            <p style="color: var(--text-muted); font-size: 0.9rem;">Ingrese a su portal privado de proyectos y cotizaciones TELEMRED</p>
        </div>

        <form method="post" action="/customers/login/">
            {% csrf_token %}
            
            <div class="form-group">
                <label for="username">Nombre de Usuario o ID de Cliente:</label>
                <input type="text" id="username" name="username" class="form-control" placeholder="Ej: admin / empresa_cliente" required autofocus>
            </div>

            <div class="form-group">
                <label for="password">Contraseña de Seguridad:</label>
                <input type="password" id="password" name="password" class="form-control" placeholder="••••••••••••" required>
            </div>

            <div style="margin-top: 2rem;">
                <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.9rem; justify-content: center;">
                    <span>🔐</span> Iniciar Sesión en TELEMRED
                </button>
            </div>
        </form>

        <div style="margin-top: 2rem; padding-top: 1.5rem; border-top: 1px solid var(--border-glass); text-align: center; font-size: 0.9rem;">
            <span style="color: var(--text-muted);">¿Aún no tiene una cuenta corporativa?</span><br>
            <a href="/customers/register/" style="font-weight: 600; color: var(--accent-turquoise); display: inline-block; margin-top: 0.4rem;">
                Solicitar Registro de Nuevo Cliente →
            </a>
        </div>
    </div>
</div>
{% endblock %}
