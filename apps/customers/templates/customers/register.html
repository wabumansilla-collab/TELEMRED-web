{% extends 'base.html' %}

{% block content %}
<div style="max-width: 520px; margin: 3rem auto;">
    <div class="form-container" style="padding: 3rem 2.5rem; border-radius: 20px;">
        <div style="text-align: center; margin-bottom: 2rem;">
            <div class="logo-icon" style="margin: 0 auto 1rem; width: 48px; height: 48px; font-size: 1.6rem;">⚡</div>
            <h1 style="font-size: 1.8rem; margin-bottom: 0.4rem;">Registro de Cuenta Cliente</h1>
            <p style="color: var(--text-muted); font-size: 0.9rem;">Cree una cuenta para acceder a historial de cotizaciones y soporte NOC exclusivo</p>
        </div>

        <form method="post" action="/customers/register/">
            {% csrf_token %}
            
            <div class="form-group">
                <label for="username">Nombre de Usuario Corporativo:</label>
                <input type="text" id="username" name="username" class="form-control" placeholder="Ej: minera_andes_admin" required autofocus>
            </div>

            <div class="form-group">
                <label for="email">Correo Electrónico de Contacto:</label>
                <input type="email" id="email" name="email" class="form-control" placeholder="Ej: proyectos@empresa.cl" required>
            </div>

            <div class="form-group">
                <label for="password">Contraseña de Seguridad:</label>
                <input type="password" id="password" name="password" class="form-control" placeholder="Mínimo 8 caracteres" required>
            </div>

            <div class="form-group">
                <label for="password_confirm">Confirmar Contraseña:</label>
                <input type="password" id="password_confirm" name="password_confirm" class="form-control" placeholder="Repita la contraseña" required>
            </div>

            <div style="margin-top: 2rem;">
                <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.9rem; justify-content: center;">
                    <span>📝</span> Registrar Cuenta en TELEMRED
                </button>
            </div>
        </form>

        <div style="margin-top: 2rem; padding-top: 1.5rem; border-top: 1px solid var(--border-glass); text-align: center; font-size: 0.9rem;">
            <span style="color: var(--text-muted);">¿Ya dispone de una cuenta activa?</span><br>
            <a href="/customers/login/" style="font-weight: 600; color: var(--accent-calipso); display: inline-block; margin-top: 0.4rem;">
                ← Volver a Iniciar Sesión
            </a>
        </div>
    </div>
</div>
{% endblock %}
